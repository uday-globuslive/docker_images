# Build and Push Azure Build Container to Docker Hub
# 
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME - Your Docker Hub username
#   DOCKERHUB_TOKEN    - Docker Hub access token (create at https://hub.docker.com/settings/security)
#
# Triggers:
#   - Push to main branch (when Dockerfile changes)
#   - Manual workflow dispatch
#   - Weekly rebuild (Sundays at 00:00 UTC) for security updates

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile_azure_build'
      - '.github/workflows/build-push.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: java21)'
        required: false
        default: 'java21'
  schedule:
    # Rebuild weekly for security updates (Sundays at 00:00 UTC)
    - cron: '0 0 * * 0'

env:
  IMAGE_NAME: azure-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'java21' }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_azure_build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Print image info
        run: |
          echo "✅ Image pushed successfully!"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:java21"
          echo ""
          echo "Use in Azure DevOps pipeline:"
          echo "  containerImage: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:java21'"
