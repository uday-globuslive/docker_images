name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'linux/**/Dockerfile'
      - 'linux/**/Dockerfile.*'
      - 'windows/**/Dockerfile'
      - 'windows/**/Dockerfile.*'
  workflow_dispatch:
    inputs:
      folder:
        description: 'Image folder to build (e.g. linux/azure-build or windows/azure-windows-build). Leave empty to build ALL images.'
        required: false
        default: ''

jobs:
  # ── Step 1: Detect which image folders changed ─────────────────────────────
  detect-changes:
    name: Detect Changed Image Folders
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed so we can diff HEAD~1

      - name: Detect changed image folders
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Runner mapping: top-level folder name → GitHub Actions runner label
          runner_for() {
            case "$1" in
              linux)   echo "ubuntu-latest" ;;
              windows) echo "windows-2025"  ;;
              *)        echo "ubuntu-latest" ;;
            esac
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_FOLDER="${{ github.event.inputs.folder }}"
            if [[ -n "$INPUT_FOLDER" ]]; then
              # e.g. "linux/azure-build"  →  treat as single entry
              FOLDERS_LIST="$INPUT_FOLDER"
            else
              # Build ALL image folders (linux/* and windows/*)
              FOLDERS_LIST=$(find linux windows -name 'Dockerfile*' 2>/dev/null \
                              | xargs -I{} dirname {} \
                              | sort -u)
            fi
          else
            # Push event: detect only changed Dockerfile folders
            FOLDERS_LIST=$(git diff --name-only HEAD~1 HEAD \
                          | grep -E '^(linux|windows)/[^/]+/Dockerfile' \
                          | xargs -I{} dirname {} \
                          | sort -u)
          fi

          echo "Folders to build: $FOLDERS_LIST"

          if [[ -z "$FOLDERS_LIST" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build include array — each entry: { folder, runner, image }
          # folder = linux/azure-build   runner = ubuntu-latest   image = azure-build
          INCLUDES='[]'
          while IFS= read -r folder; do
            [[ -z "$folder" ]] && continue
            os_group=$(echo "$folder" | cut -d/ -f1)   # linux | windows
            image=$(echo "$folder" | cut -d/ -f2)       # azure-build | azure-windows-build
            runner=$(runner_for "$os_group")
            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg f "$folder" --arg r "$runner" --arg i "$image" \
              '. += [{"folder": $f, "runner": $r, "image": $i}]')
          done <<< "$FOLDERS_LIST"

          MATRIX=$(jq -cn --argjson inc "$INCLUDES" '{"include": $inc}')
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ── Step 2: Build & push each changed image in parallel ───────────────────
  build-and-push:
    name: Build & Push → ${{ matrix.image }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false   # keep building other images even if one fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch Docker to Windows containers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "$env:ProgramFiles\Docker\Docker\DockerCli.exe" -SwitchDaemon
          Start-Sleep -Seconds 15
          docker info

      - name: Set up Docker Buildx
        if: runner.os != 'Windows'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Docker Hub image = DOCKERHUB_USERNAME/<image-name>  e.g. myorg/azure-build
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            # :latest on pushes to main
            type=raw,value=latest,enable={{is_default_branch}}
            # :a1b2c3d short SHA for traceability
            type=sha,prefix=,format=short

      - name: Build and push (Linux)
        if: runner.os != 'Windows'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.folder }}
          file: ./${{ matrix.folder }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $folder = "${{ matrix.folder }}"
          $tags   = "${{ steps.meta.outputs.tags }}" -split "`n" | Where-Object { $_ -ne "" }

          $tagArgs = $tags | ForEach-Object { "-t", $_ } | ForEach-Object { $_ }
          Write-Host "Building $folder → $($tags -join ', ')"
          docker build @tagArgs $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($tag in $tags) {
            Write-Host "Pushing $tag"
            docker push $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Image digest
        shell: bash
        run: echo "Pushed ${{ matrix.image }} (${{ matrix.runner }})"
